<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ocupación e Ingresos - Monitoreo CABA</title>
  <!-- [Tus estilos CSS aquí: la barra de navegación superior se mantiene igual] -->
  <style>
    /* Estilos idénticos para mantener la coherencia visual */
    .tabs-bar { display: flex; background: #fff; margin: 0 2rem; }
    .tab { padding: 1rem; cursor: pointer; text-decoration: none; color: #718096; font-weight: bold; }
    .tab.active { color: #1c9eda; border-bottom: 3px solid #1c9eda; }
    .grid-extensa { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 2rem; }
    /* ... tus tarjetas y estilos ... */
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN ENTRE PÁGINAS (Simula ser pestañas, pero son links reales) -->
  <div class="tabs-bar">
    <a href="#" class="tab active" onclick="navegarA('ocupacion')">Ocupación e Ingresos</a>
    <a href="#" class="tab" onclick="navegarA('sociales')">Indicadores Sociales</a>
    <a href="#" class="tab" onclick="navegarA('demograficos')">Indicadores Demográficos</a>
    <a href="#" class="tab" onclick="navegarA('fiscales')">Indicadores Fiscales</a>
  </div>

  <!-- SELECTOR DE COMUNA -->
  <div style="margin: 2rem;">
    <label>Seleccionar Territorio: </label>
    <select id="comuna-selector" onchange="cambiarComuna(this.value)">
      <option value="todas">Todas las Comunas</option>
      <option value="1">Comuna 1</option>
      <option value="2">Comuna 2</option>
      <!-- ... todas las comunas ... -->
    </select>
  </div>

  <!-- ACÁ PODÉS METER TODOS LOS INDICADORES QUE QUIERAS EN DETALLE -->
  <div class="grid-extensa">
    <div class="card"><h3>Pobreza</h3><p id="val-1">—</p></div>
    <div class="card"><h3>Tasa_desocupación</h3><p id="val-2">—</p></div>
    <div class="card"><h3>Indicador 3</h3><p id="val-3">—</p></div>
    <div class="card"><h3>Indicador 4</h3><p id="val-4">—</p></div>
    <div class="card"><h3>Indicador 5</h3><p id="val-5">—</p></div>
    <div class="card"><h3>Indicador 6</h3><p id="val-6">—</p></div>
    <!-- Poné tantas tarjetas como columnas tengas en esta pestaña de Excel -->
  </div>

  <!-- TU MAPA INTERACTIVO GLOBAL DE ESTA CATEGORÍA -->
  <iframe src="mapa_caba_economia.html" style="width:100%; height:600px; border:none;"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  // URL de la pestaña de Google Sheets específica para ESTA página
  const EXCEL_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQ8sATZf_5Ow9EM4fnHqrFsKxgPJcIFCuOJPdgUG0_Mgoft7nQvY6HH-sE86qSAeXJVVE5bXCJURnb/pub?gid=2062996270&single=true&output=csv"; 
  
  let datosComunas = {};
  let comunaActual = 'todas';

  // 1. CAPTURAR LA COMUNA DE LA URL AL CARGAR LA PÁGINA
  window.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    comunaActual = urlParams.get('comuna') || 'todas';
    
    // Dejar el selector visual en la comuna correcta
    document.getElementById('comuna-selector').value = comunaActual;

    // Cargar solo el Excel de esta página
    await cargarExcel();
    renderizarDatos();
  });

  async function cargarExcel() {
    const res = await fetch(EXCEL_CSV_URL);
    const textoCsv = await res.text();
    return new Promise((resolve) => {
      Papa.parse(textoCsv, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          results.data.forEach(fila => {
            if(fila.comuna) datosComunas[fila.comuna.trim().toLowerCase()] = fila;
          });
          resolve();
        }
      });
    });
  }

  function renderizarDatos() {
    const registro = datosComunas[comunaActual];
    if(registro) {
      // Mapeas tus N columnas del Excel a tus N tarjetas de la pantalla
      document.getElementById('val-1').textContent = registro["pob_ingresos_pobr"] || '—';
      document.getElementById('val-2').textContent = registro["tasa_desocup"] || '—';
      document.getElementById('val-3').textContent = registro["Nombre Columna 3"] || '—';
      // ... seguís con todas las que necesites desglosar en detalle
    }
  }

  // 2. SI EL USUARIO CAMBIA DE COMUNA EN ESTA PÁGINA
  function cambiarComuna(nuevaComuna) {
    comunaActual = nuevaComuna.toLowerCase();
    renderizarDatos();
  }

  // 3. EL TRUCO MAGICO: AL CAMBIAR DE PÁGINA, SE LLEVA LA COMUNA SELECCIONADA
  function navegarA(destino) {
    window.location.href = `comunas-${destino}.html?comuna=${comunaActual}`;
  }
</script>
</body>
</html>
